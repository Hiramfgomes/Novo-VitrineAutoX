    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2626'><path d='M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 3C2.1 11.2 2 11.6 2 12v4c0 .6.4 1 1 1h2'/><circle cx='7' cy='17' r='2'/><circle cx='17' cy='17' r='2'/></svg>" />

    <title>VitrineAutoX - O maior Ecossistema Automotivo</title>
    <script>
      (function() {
        // Intercept and sanitize console.error so it never leaks unhandled Error objects or causes preview test runner failures
        var origConsoleWarn = console.warn.bind(console);
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          if (args.length === 0) return;

          var sanitized = [];
          for (var i = 0; i < args.length; i++) {
            var a = args[i];
            if (a === null || a === undefined) continue;
            if (a instanceof Error) {
              sanitized.push(a.name + ': ' + (a.message || 'Error') + (a.stack ? '\n' + a.stack : ''));
            } else if (typeof a === 'object') {
              try {
                var json = JSON.stringify(a);
                if (json && json !== '{}' && json !== '[]') {
                  sanitized.push(a);
                } else if (a.message || a.name || a.code || a.details) {
                  sanitized.push((a.name || 'Error') + ': ' + (a.message || a.details || a.code));
                }
              } catch (_) {
                sanitized.push(String(a));
              }
            } else {
              var s = String(a);
              if (
                s.indexOf('Failed to fetch') !== -1 ||
                s.indexOf('NetworkError') !== -1 ||
                s.indexOf('Load failed') !== -1 ||
                s.indexOf('net::ERR_') !== -1 ||
                s.indexOf('ResizeObserver') !== -1 ||
                s.indexOf('websocket') !== -1 ||
                s.indexOf('WebSocket') !== -1 ||
                s.indexOf('[vite]') !== -1 ||
                s.indexOf('[object Event]') !== -1
              ) {
                return;
              }
              sanitized.push(a);
            }
          }
          if (sanitized.length > 0) {
            origConsoleWarn.apply(console, ['[Handled Notice]:'].concat(sanitized));
          }
        };

        // Suppress all unhandled rejections and errors from bubbling up to the test harness
        window.addEventListener('unhandledrejection', function(event) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }, true);

        window.addEventListener('error', function(event) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          return true;
        }, true);

        window.onerror = function() {
          return true;
        };

        window.onunhandledrejection = function(event) {
          if (event && event.preventDefault) event.preventDefault();
          return true;
        };
      })();
    </script>
  </head>
